document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ine-height:1.06;font-weight:800;letter-spacing:-.03em;text-wrap:balance\">Cerita aja, kamu nggak sendirian<\u002Fh1>\n        <p style=\"margin:0;font-size:clamp(16px,1.6vw,19px);line-height:1.55;color:#4A5D78;max-width:480px;text-wrap:pretty\">Djiwa siap dengerin kapan aja. Nggak ada yang nge-judge, dan kamu bisa pakai nama samaran.<\u002Fp>\n        <div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n          <button sc-camel-on-click=\"{{ startOnboard }}\" style=\"height:56px;padding:0 28px;border-radius:14px;border:0;background:#0E7C76;color:#fff;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;flex:1 1 auto;max-width:280px\" style-hover=\"background:#0B6560\">Mulai ngobrol <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n          <button sc-camel-on-click=\"{{ openTg }}\" style=\"height:56px;padding:0 20px;border-radius:14px;border:0;background:transparent;font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px\" style-hover=\"background:#fff\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1E3A5F\" stroke-width=\"1.8\" stroke-linejoin=\"round\"><path d=\"M21 4L3 11l6 2 2 6 3-4 5 4z\"><\u002Fpath><\u002Fsvg>Lewat Telegram<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"aspect-ratio:5/4;border-radius:28px;background:#DDF2EF;border:2px dashed #9FD3CE;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:14px;font-weight:600;color:#0B5F5A\">Ilustrasi flat: remaja memegang HP, tersenyum tenang<\u002Fdiv>\n    <\u002Fdiv>\n    <div id=\"cara\" style=\"background:#fff;padding:56px 20px\">\n      <div style=\"max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:24px\">\n        <h2 style=\"margin:0;font-size:clamp(24px,3vw,34px);font-weight:800;letter-spacing:-.02em\">Cara kerjanya<\u002Fh2>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px\">\n          <sc-for list=\"{{ steps }}\" as=\"s\" hint-placeholder-count=\"3\">\n            <div style=\"padding:24px;border-radius:16px;background:#FAF8F5;display:flex;flex-direction:column;gap:12px\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center\"><div style=\"width:52px;height:52px;border-radius:16px;background:{{ s.bg }};display:flex;align-items:center;justify-content:center\"><svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"{{ s.ink }}\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"{{ s.icon }}\"><\u002Fpath><\u002Fsvg><\u002Fdiv><span style=\"font-size:36px;font-weight:800;color:#E7E1D8\">{{ s.n }}<\u002Fspan><\u002Fdiv>\n              <div style=\"font-size:19px;font-weight:700\">{{ s.title }}<\u002Fdiv>\n              <div style=\"font-size:15px;line-height:1.55;color:#4A5D78\">{{ s.body }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"max-width:1200px;margin:0 auto;padding:56px 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px\">\n      <div id=\"privasi\" style=\"padding:28px;border-radius:24px;background:#DDF2EF;display:flex;flex-direction:column;gap:20px\">\n        <div style=\"display:flex;align-items:center;gap:10px\"><svg width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0B5F5A\" stroke-width=\"1.8\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><path d=\"M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z\"><\u002Fpath><path d=\"M9 12l2 2 4-4\"><\u002Fpath><\u002Fsvg><h2 style=\"margin:0;font-size:clamp(22px,2.6vw,30px);font-weight:800;letter-spacing:-.02em\">Privasimu aman<\u002Fh2><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px\">\n          <sc-for list=\"{{ privacy }}\" as=\"p\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"width:44px;height:44px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0E7C76\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"{{ p.icon }}\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div style=\"font-size:16px;font-weight:700\">{{ p.title }}<\u002Fdiv><div style=\"font-size:14px;line-height:1.5;color:#3B5470\">{{ p.body }}<\u002Fdiv><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"padding:16px;border-radius:14px;background:#fff;display:flex;gap:12px;align-items:flex-start\">\n          <svg style=\"flex:none\" width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1E3A5F\" stroke-width=\"1.8\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 11v5M12 8h.01\"><\u002Fpath><\u002Fsvg>\n          <div style=\"font-size:14px;line-height:1.55;color:#4A5D78;text-wrap:pretty\"><b style=\"color:#1E3A5F\">AmanDjiwa bukan alat diagnosis.<\u002Fb> Djiwa bantu kamu mengenali perasaan lebih awal. Untuk diagnosis, tetap perlu psikolog atau tenaga kesehatan. Kami bisa bantu hubungkan.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div id=\"bantuan\" style=\"padding:28px;border-radius:24px;background:#FBEBDD;display:flex;flex-direction:column;gap:12px\">\n        <div style=\"font-size:clamp(20px,2.4vw,26px);font-weight:800;letter-spacing:-.02em\">Butuh bantuan sekarang?<\u002Fdiv>\n        <div style=\"font-size:15px;line-height:1.5;color:#5A3A22\">Kamu bisa langsung hubungi salah satu ini. Gratis.<\u002Fdiv>\n :flex;gap:20px;font-size:14px;font-weight:600\"><a href=\"#\" style=\"color:#fff\">Kebijakan privasi<\u002Fa><a href=\"#\" style=\"color:#fff\">Kontak<\u002Fa><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isOnboard }}\">\n  <div style=\"min-height:calc(100vh - 48px);display:flex;justify-content:center;align-items:flex-start;padding:{{ obPad }};background:{{ obBg }}\">\n    <div style=\"width:100%;max-width:460px;background:#FAF8F5;border-radius:{{ obRadius }};box-shadow:{{ obShadow }};display:flex;flex-direction:column;min-height:{{ obMinH }}\">\n      <sc-if value=\"{{ showProgress }}\">\n        <div style=\"padding:12px 12px 0;display:flex;align-items:center;gap:6px\">\n          <button sc-camel-on-click=\"{{ obBack }}\" aria-label=\"Kembali\" style=\"width:44px;height:44px;border:0;background:transparent;border-radius:12px;display:flex;align-items:center;justify-content:center\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1E3A5F\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 6l-6 6 6 6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n          <div style=\"flex:1;display:flex;gap:6px\"><sc-for list=\"{{ segs }}\" as=\"g\" hint-placeholder-count=\"4\"><div style=\"flex:1;height:6px;border-radius:3px;background:{{ g.bg }};transition:background .3s\"><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n          <div style=\"width:44px;text-align:center;font-size:12px;font-weight:700;color:#4A5D78\">{{ stepLabel }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isStep1 }}\">\n        <div style=\"padding:24px;display:flex;flex-direction:column;gap:20px;flex:1;animation:dj-in .3s ease-out\">\n          <div style=\"display:flex;flex-direction:column;gap:8px\"><h1 style=\"margin:0;font-size:26px;line-height:1.2;font-weight:800;letter-spacing:-.02em\">Hai! Yuk masuk dulu<\u002Fh1><p style=\"margin:0;font-size:15px;line-height:1.55;color:#4A5D78\">Email cuma dipakai buat login. Nggak bakal ditampilkan ke siapa pun.<\u002Fp><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px\">\n            <label for=\"ob-email\" style=\"font-size:14px;font-weight:600\">Email kamu<\u002Flabel>\n            <input id=\"ob-email\" type=\"email\" value=\"{{ email }}\" sc-camel-on-change=\"{{ setEmail }}\" placeholder=\"nama@email.com\" style=\"height:52px;border-radius:14px;background:#fff;border:1.5px solid {{ emailBorder }};padding:0 16px;font-size:16px;outline:none\">\n            <sc-if value=\"{{ emailErr }}\"><span style=\"font-size:13px;font-weight:600;color:#9A4A0F\">Cek lagi ya, formatnya belum kayak email.<\u002Fspan><\u002Fsc-if>\n          <\u002Fdiv>\n          <sc-if value=\"{{ notCodeSent }}\"><button sc-camel-on-click=\"{{ sendCode }}\" style=\"height:52px;border-radius:14px;border:0;background:#0E7C76;color:#fff;font-size:16px;font-weight:700\" style-hover=\"background:#0B6560\">Kirim kode<\u002Fbutton><\u002Fsc-if>\n          <sc-if value=\"{{ codeSent }}\">\n            <div style=\"padding:16px;border-radius:16px;background:#fff;border:1px solid #EDE7DF;display:flex;flex-direction:column;gap:10px;animation:dj-in .3s ease-out\">\n              <label for=\"ob-otp\" style=\"font-size:14px;font-weight:700\">Masukkan 6 digit kode<\u002Flabel>\n              <span style=\"font-size:13px;line-height:1.5;color:#4A5D78\">Kode dikirim ke {{ email }}. Untuk prototipe, ketik 6 angka apa aja.<\u002Fspan>\n              <input id=\"ob-otp\" inputmode=\"numeric\" maxlength=\"6\" value=\"{{ otp }}\" sc-camel-on-change=\"{{ setOtp }}\" placeholder=\"••••••\" style=\"height:56px;border-radius:12px;background:#FAF8F5;border:1.5px solid #DDD5CA;padding:0 16px;font-size:24px;font-weight:700;letter-spacing:.5em;text-align:center;outline:none\">\n              <button sc-camel-on-click=\"{{ verifyOtp }}\" disabled=\"{{ otpDisabled }}\" style=\"height:52px;border-radius:14px;border:0;background:{{ otpBtnBg }};color:#fff;font-size:16px;font-weight:700\">Masuk<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ resendCode }}\" style=\"height:44px;border:0;background:transparent;font-size:13px;font-weight:700;color:#0E7C76\">Kirim ulang kode<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"display:flex;align-items:center;gap:12px;font-size:13px;color:#4A5D78\"><div style=\"flex:1;height:1px;background:#E7E1D8\"><\u002Fdiv>atau<div style=\"flex:1;height:1px;background:#E7E1D8\"><\u002Fdiv><\u002Fdiv>\n          <button sc-camel-on-click=\"{{ google }}\" style=\"height:52px;border-radius:14px;background:#fff;border:1.5px solid #DDD5CA;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px\" style-hover=\"border-color:#1E3A5F\"><span style=\"width:22px;height:22px;border-radius:50%;border:2px solid #1E3A5F;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800\">G<\u002Fspan>Masuk dengan Google<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isStep2 }}\">\n        <div style=\"padding:20px 24px 24px;display:flex;flex-direction:column;gap:18px;flex:1;animation:dj-in .3s ease-out\">\n          <div style=\"display:flex;flex-direction:column;gap:6px\"><h1 style=\"margin:0;font-size:24px;line-height:1.2;font-weight:800;letter-spacing:-.02em\">Kamu mau dipanggil apa?<\u002Fh1><p style=\"margin:0;font-size:14px;line-height:1.5;color:#4A5D78\">Pakai nama samaran aja. Nggak perlu nama asli.<\u002Fp><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px\">\n            <label for=\"ob-nick\" style=\"font-size:14px;font-weight:600\">Nama samaran<\u002Flabel>\n            <div style=\"display:flex;gap:8px\"><input id=\"ob-nick\" value=\"{{ nick }}\" sc-camel-on-change=\"{{ setNick }}\" maxlength=\"20\" placeholder=\"Contoh: Bintang Senja\" style=\"flex:1;min-width:0;height:50px;border-radius:14px;background:#fff;border:1.5px solid #DDD5CA;padding:0 16px;font-size:16px;outline:none\"><button sc-camel-on-click=\"{{ randomNick }}\" style=\"height:50px;padding:0 14px;border-radius:14px;border:0;background:#DDF2EF;color:#0B5F5A;font-size:14px;font-weight:700\">Acak<\u002Fbutton><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <span style=\"font-size:14px;font-weight:600\">Pilih avatar<\u002Fspan>\n            <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:10px\" role=\"radiogroup\" aria-label=\"Avatar\">\n              <sc-for list=\"{{ avatars }}\" as=\"a\" hint-placeholder-count=\"8\">\n                <button sc-camel-on-click=\"{{ a.pick }}\" role=\"radio\" aria-checked=\"{{ a.on }}\" aria-label=\"{{ a.name }}\" style=\"aspect-ratio:1;border-radius:50%;background:{{ a.bg }};border:3px solid {{ a.ring }};display:flex;align-items:center;justify-content:center;transition:border-color .2s\"><svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"{{ a.ink }}\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"{{ a.d }}\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px\">\n            <span style=\"font-size:14px;font-weight:600\">Kelurahan <span style=\"font-weight:500;color:#4A5D78\">· Semarang Barat<\u002Fspan><\u002Fspan>\n            <button sc-camel-on-click=\"{{ openKel }}\" style=\"height:50px;border-radius:14px;background:#fff;border:1.5px solid #DDD5CA;padding:0 14px 0 16px;font-size:16px;display:flex;align-items:center;justify-content:space-between;text-align:left;color:{{ kelInk }}\">{{ kelText }}<svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1E3A5F\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <span style=\"font-size:14px;font-weight:600\">Tahun lahir<\u002Fspan>\n            <div style=\"display:flex;flex-wrap:wrap;gap:8px\"><sc-for list=\"{{ years }}\" as=\"y\" hint-placeholder-count=\"7\"><button sc-camel-on-click=\"{{ y.pick }}\" style=\"height:44px;padding:0 14px;border-radius:12px;border:1.5px solid {{ y.border }};background:{{ y.bg }};color:{{ y.color }};font-size:15px;font-weight:700\">{{ y.y }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ next2 }}\" disabled=\"{{ s2Disabled }}\" style=\"margin-top:auto;height:52px;border-radius:14px;border:0;background:{{ s2Bg }};color:#fff;font-size:16px;font-weight:700\">Lanjut<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isStep3 }}\">\n        <div style=\"padding:18px 24px 24px;display:flex;flex-direction:column;gap:12px;flex:1;animation:dj-in .3s ease-out\">\n          <h1 style=\"margin:0 0 4px;font-size:24px;line-height:1.2;font-weight:800;letter-spacing:-.02em\">Sebelum mulai, ini janji kami<\u002Fh1>\n          <sc-for list=\"{{ consent }}\" as=\"c\" hint-placeholder-count=\"4\">\n            <div style=\"padding:14px;border-radius:14px;background:{{ c.bg }};border:1px solid {{ c.border }};display:flex;gap:12px\"><div style=\"flex:none;width:36px;height:36px;border-radius:10px;background:{{ c.iconBg }};display:flex;align-items:center;justify-content:center\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"{{ c.ink }}\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"{{ c.icon }}\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div><div style=\"font-size:14px;font-weight:700\">{{ c.title }}<\u002Fdiv><div style=\"font-size:13px;line-height:1.5;color:#3B5470\">{{ c.body }}<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <\u002Fsc-for>\n          <button sc-camel-on-click=\"{{ toggleAgree }}\" role=\"checkbox\" aria-checked=\"{{ agree }}\" style=\"margin-top:auto;display:flex;gap:12px;align-items:center;padding:8px 0;border:0;background:transparent;text-align:left;min-height:44px\">\n            <span style=\"flex:none;width:26px;height:26px;border-radius:8px;background:{{ agreeBg }};border:2px solid #0E7C76;display:flex;align-items:center;justify-content:center\"><sc-if value=\"{{ agree }}\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3\" stroke-linecap=\"round\"><path d=\"M5 12l5 5 9-10\"><\u002Fpath><\u002Fsvg><\u002Fsc-if><\u002Fspan>\n            <span style=\"font-size:14px;line-height:1.5\">Aku sudah baca dan paham.<\u002Fspan>\n          <\u002Fbutton>\n          <button sc-camel-on-click=\"{{ next3 }}\" disabled=\"{{ s3Disabled }}\" style=\"height:52px;border-radius:14px;border:0;background:{{ s3Bg }};color:#fff;font-size:16px;font-weight:700\">Aku setuju<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isStep4 }}\">\n        <div style=\"padding:24px;display:flex;flex-direction:column;gap:20px;flex:1;animation:dj-in .3s ease-out\">\n          <div style=\"display:flex;flex-direction:column;gap:8px\"><h1 style=\"margin:0;font-size:24px;line-height:1.2;font-weight:800;letter-spacing:-.02em\">Satu langkah lagi<\u002Fh1><p style=\"margin:0;font-size:15px;line-height:1.55;color:#4A5D78;text-wrap:pretty\">Karena kamu belum 18 tahun, kami perlu izin orang tua atau wali kamu dulu.<\u002Fp><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px\"><label for=\"ob-pemail\" style=\"font-size:14px;font-weight:600\">Email orang tua / wali<\u002Flabel><input id=\"ob-pemail\" type=\"email\" value=\"{{ parentEmail }}\" sc-camel-on-change=\"{{ setParentEmail }}\" placeholder=\"email.ortu@email.com\" style=\"height:52px;border-radius:14px;background:#fff;border:1.5px solid #DDD5CA;padding:0 16px;font-size:16px;outline:none\"><\u002Fdiv>\n          <div style=\"padding:16px;border-radius:14px;background:#DDF2EF;display:flex;flex-direction:column;gap:8px\"><div style=\"font-size:14px;font-weight:700;color:#0B5F5A\">Yang orang tuamu terima<\u002Fdiv><div style=\"font-size:13px;line-height:1.55\">Email berisi penjelasan AmanDjiwa dan tombol persetujuan.<\u002Fdiv><div style=\"font-size:13px;line-height:1.55\"><b>Mereka nggak bisa baca obrolanmu<\u002Fb>, dan nggak lihat nama samaranmu.<\u002Fdiv><\u002Fdiv>\n          <button sc-camel-on-click=\"{{ sendParent }}\" disabled=\"{{ s4Disabled }}\" style=\"margin-top:auto;height:52px;border-radius:14px;border:0;background:{{ s4Bg }};color:#fff;font-size:16px;font-weight:700\">Kirim permintaan izin<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isWaiting }}\">\n        <div style=\"padding:28px 24px;display:flex;flex-direction:column;gap:16px;flex:1;align-items:center;text-align:center;animation:dj-in .3s ease-out\">\n          <div style=\"width:100%;aspect-ratio:4/3;max-height:220px;border-radius:24px;background:#E9E5F7;border:2px dashed #C6BDEA;display:flex;align-items:center;justify-content:center;padding:20px;font-size:13px;font-weight:600;color:#5B4B9A\">Ilustrasi menenangkan: remaja duduk santai, amplop surat terbang<\u002Fdiv>\n          <h1 style=\"margin:8px 0 0;font-size:24px;line-height:1.2;font-weight:800;letter-spacing:-.02em\">Menunggu persetujuan orang tua<\u002Fh1>\n          <p style=\"margin:0;font-size:15px;line-height:1.55;color:#4A5D78;text-wrap:pretty\">Kami sudah kirim email ke <b style=\"color:#1E3A5F\">{{ parentEmail }}<\u002Fb>. Begitu disetujui, kamu langsung bisa ngobrol sama Djiwa.<\u002Fp>\n          <div style=\"padding:10px 14px;border-radius:999px;background:#fff;border:1px solid #EDE7DF;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600\"><span style=\"width:8px;height:8px;border-radius:50%;background:#1BA39C\"><\u002Fspan>Email terkirim<\u002Fdiv>\n          <div style=\"margin-top:auto;width:100%;display:flex;flex-direction:column;gap:8px\">\n            <button sc-camel-on-click=\"{{ openParent }}\" style=\"height:52px;border-radius:14px;border:0;background:#5B4B9A;color:#fff;font-size:15px;font-weight:700\">Simulasi: buka email yang diterima ortu<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ resendParent }}\" style=\"height:48px;border-radius:14px;background:#fff;border:1.5px solid #0E7C76;color:#0E7C76;font-size:15px;font-weight:700\">Kirim ulang email<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ changeParent }}\" style=\"height:44px;border:0;background:transparent;font-size:14px;font-weight:600\">Ganti email orang tua<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"width:100%;padding:12px 14px;border-radius:14px;background:#FBEBDD;font-size:13px;line-height:1.5;color:#5A3A22;text-align:left\">Butuh bantuan sekarang? Layanan darurat tetap bisa kamu hubungi: <b>[ nomor ]<\u002Fb><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isParent }}\">\n  <div style=\"min-height:calc(100vh - 48px);background:#F1ECE5;padding:{{ obPad }};display:flex;justify-content:center;align-items:flex-start\">\n    <div style=\"width:100%;max-width:640px;background:#FAF8F5;border-radius:{{ obRadius }};box-shadow:{{ obShadow }};overflow:hidden\">\n      <div style=\"padding:16px 24px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #EDE7DF;background:#fff;flex-wrap:wrap\">\n        <svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z\" fill=\"#1BA39C\"><\u002Fpath><circle cx=\"12\" cy=\"9\" r=\"2.1\" fill=\"#fff\"><\u002Fcircle><path d=\"M8.4
