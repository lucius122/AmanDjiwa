# Target koreksi salah ketik (hanya untuk kata ≥ 5 huruf yang tidak ada di kamus).
# Sengaja sempit: hanya kata kunci krisis, supaya kata biasa tidak berubah arti.
fuzzy_targets: [bunuh, gantung, silet, nyilet, sayat, nyayat, racun, overdosis, menyakiti, melukai, akhiri, menyerah]
# Kata baku sehari-hari yang mirip target fuzzy TAPI bukan typo-nya. Tanpa daftar ini,
# "aku butuh rencana belajar" → "bunuh rencana" dan "akhir pekan" → "akhiri" memicu krisis palsu
# (ditemukan saat red-team 2026-10-06). Typo & bentuk slang krisis (akhirin, nyiletin) tetap cocok.
fuzzy_exclude: [akhir, butuh, buruh, ganteng, gantungan, kantung, melukis, menyakitkan, menyerahkan,
                menyerap, rakun, rancu, sayap, silat]
