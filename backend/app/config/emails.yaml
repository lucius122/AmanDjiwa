# DESIGN-GAP: isi email ke orang tua tidak ada di design/. Diturunkan dari halaman
# "Persetujuan Orang Tua / Wali" di prototipe. Perlu direview tim + psikolog.
guardian_request:
  subject: Permohonan izin penggunaan layanan AmanDjiwa
  body: |
    Bapak/Ibu yang kami hormati,

    Putra/putri Anda telah mendaftar di AmanDjiwa dan memerlukan persetujuan Anda untuk melanjutkan.

    AmanDjiwa adalah layanan skrining dini kesehatan mental bagi remaja Kota Semarang. Layanan ini bukan alat diagnosis medis. Isi percakapan tidak dibagikan kepada orang tua maupun pihak sekolah.

    Baca ketentuan lengkap dan berikan persetujuan Anda di tautan berikut:
    {link}

    Tautan berlaku {days} hari. Anda dapat mencabut persetujuan sewaktu-waktu melalui tautan yang sama.

    Pertanyaan? Hubungi tim AmanDjiwa di {contact}

# Di desain tertulis "[ kontak ]". Jangan dikarang.
contact: TODO_VERIFY

# ---------- untuk staf (jobs/). DESIGN-GAP: tidak ada di desain. TODO_VERIFY: review tim. ----------
# Sengaja tanpa nama samaran / isi pesan: email bisa terbuka di perangkat bersama (§7).
red_alert:
  subject: Kasus merah baru · Kelurahan {kelurahan}
  body: |
    Ada kasus risiko merah baru yang belum ditangani di Kelurahan {kelurahan}.
    Buka antrian sekarang: {link}

    Email ini sengaja tidak memuat identitas atau isi pesan.
    Notifikasi ini bisa dimatikan di menu Pengaturan dasbor ("Notifikasi kasus merah").

weekly_report:
  subject: Laporan mingguan AmanDjiwa · {periode}
  intro: Ringkasan {periode}, Kecamatan Semarang Barat. Data agregat anonim; kelurahan dengan < {k} pengguna tidak ditampilkan.
  kpis: |
    Pengguna aktif: {active}
    Sesi: {sessions}
    Kasus oranye/merah disapa < 15 menit: {handled}
    Rujukan: {referrals}
  not_enough: Data periode ini belum cukup (< {k} pengguna) untuk ditampilkan.
  top_kelurahan: "Proporsi risiko tertinggi (oranye + merah):"
  top_topics: "Topik pemicu teratas:"
  footer: "Dasbor lengkap: {link}"
